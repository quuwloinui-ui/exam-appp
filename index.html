<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<title>منصة الامتحانات</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1B33;--s1:#12284A;--s2:#1A3560;--ln:#27456F;--tx:#EAF1FA;--mu:#9DB2CC;--pr:#2DD4BF;--pt:#06222B;--gold:#E3B95A;--bad:#FF8A80;--ok:#5EEAD4;color-scheme:dark}
:root[data-theme=light]{--bg:#F3F6FB;--s1:#FFFFFF;--s2:#EAF0F8;--ln:#D3DDEB;--tx:#0B1B33;--mu:#51647F;--pr:#0F766E;--pt:#FFFFFF;--gold:#8F620A;--bad:#B3261E;--ok:#0F766E;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.7}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
h1{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--ln)}
.back{display:inline-flex;padding:4px;margin-inline-start:-8px;color:var(--mu)}
[dir=rtl] .back svg{transform:scaleX(-1)}
main{padding:16px}
.card{display:block;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card.open{border-inline-start:4px solid var(--gold)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mu{color:var(--mu);font-size:.875rem}
.empty{color:var(--mu);text-align:center;padding:32px 8px}
.chip{flex:none;font-size:.75rem;padding:1px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.chip.live{color:var(--gold);border-color:var(--gold)}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.cd{display:inline-block;direction:ltr;font-variant-numeric:tabular-nums;font-size:2rem;font-weight:700;line-height:1.3;color:var(--gold);margin-top:6px}
.score{font-size:1.6rem;font-weight:700;margin-top:4px}
.score span{font-size:.9rem;font-weight:400;color:var(--mu)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--pr);color:var(--pt);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx)}
.btn:disabled{opacity:.5;cursor:default}
.full{width:100%}.mb{margin-bottom:12px}.mt{margin-top:12px}
input,textarea{display:block;width:100%;min-height:46px;padding:10px 12px;margin-top:6px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:inherit}
label{display:block;font-size:.875rem;color:var(--mu)}
.stack>*+*{margin-top:14px}
.err{color:var(--bad);min-height:1.5em;font-size:.9rem}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;color:var(--mu);font:inherit;cursor:pointer}
.seg button.on{background:var(--pr);color:var(--pt);font-weight:700}
.login{padding:calc(40px + env(safe-area-inset-top)) 20px 24px}
.brand{text-align:center;margin-bottom:28px}
.brand img{border-radius:14px;margin-bottom:12px}
.brand p{color:var(--mu)}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;max-width:600px;margin:0 auto;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--mu);font-size:.75rem}
.nav a.on{color:var(--pr);font-weight:600}
.dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#201500;font-size:.7rem;font-weight:700;line-height:18px;text-align:center}
.pg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--ln);margin-bottom:10px;background:#fff}
.files{list-style:none;margin:10px 0 0;padding:0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:.9rem;word-break:break-all}
.x{flex:none;width:36px;height:36px;border:0;border-radius:8px;background:var(--s2);color:var(--bad);font-size:1.2rem;cursor:pointer}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0;margin:0;min-height:0;padding:0}
.bar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pr)}
.pre{white-space:pre-wrap}
.load{text-align:center;color:var(--mu);padding:80px 16px}
.ver{text-align:center;margin-top:20px}
#toast{position:fixed;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:9;max-width:560px;margin:0 auto;padding:12px 16px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);text-align:center;opacity:0;pointer-events:none}
#toast.show{opacity:1}
#toast.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<div id="app"><div class="load">جارٍ التحميل…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
